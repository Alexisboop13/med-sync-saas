# render.yaml — Blueprint de despliegue en Render
# ──────────────────────────────────────────────────────────────────────────────
# Aplica este blueprint desde el dashboard de Render: "New → Blueprint" → elige
# este repo. Render te deja revisar/ajustar los planes antes de crear nada.
#
# Secretos: JWT_SECRET_KEY, SEARCH_HMAC_KEY y AGENT_SECRET_KEY se generan
# automáticamente (generateValue). ENCRYPTION_KEYS queda en sync:false porque
# tiene que ser exactamente 32 bytes en base64 (AES-256) — el valor que genera
# Render para generateValue no garantiza ese formato — así que se pega a mano
# en el dashboard una vez creado el servicio (ver scripts/generate_secrets.py).
# SMTP/S3/Stripe/GreenAPI se dejan sin configurar por ahora; la app arranca
# bien sin ellos (ver README) y se pueden agregar después desde el dashboard.

databases:
  - name: med-sync-db
    databaseName: medsync
    plan: 0.1c-256mb   # $6/mes, el plan pagado más barato — pendiente de tu OK
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: med-sync-redis
    plan: free         # pendiente de tu OK — ver alternativa pagada en el PR/chat

  - type: web
    name: med-sync-saas
    runtime: python
    plan: 0.5c-512mb   # $7/mes, el plan pagado más barato que no se duerme — pendiente de tu OK
    buildCommand: pip install -r requirements.txt
    startCommand: "alembic upgrade head && gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: ENVIRONMENT
        value: production
      - key: APP_ENV
        value: production
      - key: WHATSAPP_MODE
        value: manual
      - key: TRIAL_DAYS
        value: "7"
      - key: APP_BASE_URL
        value: https://med-sync-saas.onrender.com
      - key: CORS_ORIGINS
        value: https://med-sync-saas.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: med-sync-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: med-sync-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SEARCH_HMAC_KEY
        generateValue: true
      - key: AGENT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEYS
        sync: false   # pegar a mano en el dashboard: 32 bytes en base64 (ver scripts/generate_secrets.py)
